<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061126">
  <meta name="description" content="AIMS Comms Hub operator console">
  <title>AIMS Comms Hub</title>
  <link rel="icon" href="./assets/CogniPal.jpg">
  <link rel="stylesheet" href="../../packages/theme/tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-loading" aria-live="polite">
    <div class="boot-card">
      <img src="./assets/CogniPal.jpg" alt="" class="boot-logo">
      <div>
        <strong>Opening AIMS Comms Hub</strong>
        <span>Preparing the operator workspace…</span>
      </div>
    </div>
  </div>
  <template id="comms-indicator-key">
    <details class="comms-indicator-key"><summary>Indicator key</summary>
      <p>Cards: priority above status. Tables: separate columns.</p>
      <section><strong>Priority</strong><div class="comms-key-items">
        <span><span class="signal-lamp signal-red" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>Critical</span>
        <span><span class="signal-lamp signal-orange" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>High</span>
        <span><span class="signal-lamp signal-amber" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Medium</span>
        <span><span class="signal-lamp signal-info" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Normal</span>
        <span><span class="signal-lamp signal-low" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="true"></span></span>Low</span>
        <span><span class="signal-lamp signal-neutral" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Unknown</span>
      </div></section>
      <section><strong>Conversation</strong><div class="comms-key-items">
        <span><span class="signal-lamp signal-red" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>Failed / blocked</span>
        <span><span class="signal-lamp signal-amber" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Pending</span>
        <span><span class="signal-lamp signal-info" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Open</span>
        <span><span class="signal-lamp signal-green" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="true"></span></span>Resolved / sent</span>
        <span><span class="signal-lamp signal-purple" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Snoozed</span>
        <span><span class="signal-lamp signal-neutral" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Unknown</span>
      </div></section>
    </details>
  </template>
  <script type="module" src="./app.js"></script>
</body>
</html>
