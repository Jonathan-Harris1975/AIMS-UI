<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061126">
  <meta name="description" content="AIMS Comms Hub operator console">
  <title>AIMS Comms Hub</title>
  <link rel="icon" href="./assets/CogniPal.jpg">
  <link rel="stylesheet" href="../../packages/theme/tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-loading" aria-live="polite">
    <div class="boot-card">
      <img src="./assets/CogniPal.jpg" alt="" class="boot-logo">
      <div>
        <strong>Opening AIMS Comms Hub</strong>
        <span>Preparing the operator workspace…</span>
      </div>
    </div>
  </div>
  <template id="console-icons">
    <svg data-icon="dashboard" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z"/></svg>
    <svg data-icon="inbox" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12h-5l-2 3h-2l-2-3H4V4Zm2 2v8h4l2 3 2-3h4V6H6Z"/></svg>
    <svg data-icon="allConversations" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v3H3V4Zm0 6h18v3H3v-3Zm0 6h18v3H3v-3Z"/></svg>
    <svg data-icon="outreach" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 11 22 2l-6 20-5-8-9-3Zm9 1.2 4.4 6.9L19 5.6l-13 5.8 5 0.8Z"/><path d="m10 13 8-8 1 1-8 8-1-1Z"/></svg>
    <svg data-icon="dm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H8l-4 4V4Zm3 4v2h10V8H7Zm0 4v2h7v-2H7Z"/></svg>
    <svg data-icon="comment" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c5.5 0 10 3.6 10 8s-4.5 8-10 8H9l-5 3 1.5-5.3C3.3 15.2 2 13.2 2 11c0-4.4 4.5-8 10-8Z"/>
<circle cx="7.5" cy="11" r="1.2" fill="var(--aims-bg)"/><circle cx="12" cy="11" r="1.2" fill="var(--aims-bg)"/><circle cx="16.5" cy="11" r="1.2" fill="var(--aims-bg)"/></svg>
    <svg data-icon="approval" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.1 3.4 9.8 8 11 4.6-1.2 8-5.9 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4 2.6 2.6 4.6-4.6L17 10l-6 6Z"/></svg>
    <svg data-icon="contacts" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0H5Z"/></svg>
    <svg data-icon="workflow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h6v5H6V3Zm8 13h4v5h-6v-5h2Zm-9-1h6v5H5v-5Zm4-7v3h6v3h2v-5H11V8H9Z"/></svg>
    <svg data-icon="quarantine" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.7 9 10 5.2-.3 9-5 9-10V6l-9-4Zm-1 5h2v7h-2V7Zm0 9h2v2h-2v-2Z"/></svg>
    <svg data-icon="analytics" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H2V3h2v16Zm3-2v-6h3v6H7Zm5 0V7h3v10h-3Zm5 0V4h3v13h-3Z"/></svg>
    <svg data-icon="mail" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3V5Zm2 2v1l7 5 7-5V7H5Zm14 10v-6.6l-7 5-7-5V17h14Z"/></svg>
    <svg data-icon="settings" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m19.4 13 .1-1-.1-1 2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 2.6
      a8 8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5-.1 1 .1 1-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1L11 21h4
      l.4-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/>
  </svg>
    <svg data-icon="search" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 19.6-5.2-5.2a7 7 0 1 0-1.4 1.4l5.2 5.2 1.4-1.4ZM5 10a5 5 0 1 1 10 0 5 5 0 0 1-10 0Z"/></svg>
    <svg data-icon="bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16l-2-2Zm-8 4h4a2 2 0 0 1-4 0Z"/></svg>
    <svg data-icon="menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
    <svg data-icon="close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
    <svg data-icon="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L9 5Z"/></svg>
    <svg data-icon="home" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 8-1.3 1.5L18 11v9h-5v-6h-2v6H6v-9l-1.7 1.5L3 11l9-8Z"/></svg>
    <svg data-icon="download" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V3ZM5 19h14v2H5v-2Z"/></svg>
    <svg data-icon="chevronDown" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 8.3 5.3 5.3 5.3-5.3 1.4 1.4-6.7 6.7-6.7-6.7 1.4-1.4Z"/></svg>
    <svg data-icon="more" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
  </template>
  <template id="workflow-card">
<article class="workflow-card">
        <div class="workflow-node">{{0}}</div>
        <div>
          <strong>{{1}}</strong>
          <span>{{2}} loaded conversation{{3}}</span>
          <small>Protected gateway controls.</small>
        </div>
        <button class="button secondary" data-view="inbox">Inspect queue</button>
      </article>
  </template>
  <template id="workspace-auto-sent">
<div class="auto-sent-box">
            <strong>Sent automatically</strong>
            <dl>
              <div>
                <dt>Channel</dt>
                <dd>{{0}}</dd>
              </div>
              <div><dt>Confidence</dt><dd>{{1}}</dd></div>
              <div><dt>Grounding</dt><dd>{{2}}</dd></div>
              <div><dt>Model</dt><dd>{{3}}</dd></div>
            </dl>
            <p>{{4}}</p>
            <small>{{5}}</small>
          </div>
  </template>
  <template id="workspace-message">
<article
            class="message {{0}}">
            <div class="message-avatar">
              {{1}}
            </div>
            <div>
              <header>
                <strong>{{2}}</strong>
                <time>{{3}}</time>
              </header>
              <p>{{4}}</p>
            </div>
          </article>
  </template>
  <template id="note-composer">
<form id="note-form" class="note-form">
            <textarea name="bodyText" rows="2" placeholder="Add a private note"
              aria-label="Private note" required></textarea>
            <button class="button secondary" type="submit">Add note</button>
          </form>
  </template>
  <template id="notice-row">
<button type="button" class="notification-item severity-{{0}}"
            title="{{1}}"
            data-notification-id="{{2}}"
            data-conversation-id="{{3}}">
{{4}}
<span>
<span class="sr-only">{{1}}: </span>
<strong>{{5}}</strong>
<small>{{6}}</small>
<time>{{7}}</time>
</span>
</button>
  </template>
  <template id="mail-reader">
<header class="manual-mail-message-header">
          <div><h2>{{0}}</h2>
            <p>From {{1}}
              &lt;{{2}}&gt;</p>
            <time>{{3}}</time></div>
          <div class="manual-mail-actions">
            <button class="button primary" data-action="reply-mail">Reply</button>
            <label class="manual-mail-move"><span class="sr-only">Move to folder</span>
              <select data-mail-move aria-label="Move email to folder">
                <option value="">Move to…</option>{{4}}
              </select></label>
            <button class="button danger" data-action="delete-mail">Delete</button>
          </div>
        </header>
        <div class="manual-mail-body">{{5}}</div>
  </template>
  <template id="settings-connection">
<section class="panel settings-card">
<h3>Console connection</h3>
<dl>
<div><dt>API gateway</dt><dd>{{0}}</dd></div>
<div><dt>Mode</dt><dd>Live</dd></div>
<div><dt>API version</dt><dd>{{1}}</dd></div>
</dl>
</section>
  </template>
  <template id="settings-identity">
<section class="panel settings-card">
<h3>Verified identity</h3>
<dl>
<div><dt>Actor</dt><dd>{{0}}</dd></div>
<div><dt>Role</dt><dd>{{1}}</dd></div>
<div><dt>Strategy</dt><dd>{{2}}</dd></div>
</dl>
</section>
  </template>
  <template id="settings-email">
<section class="panel settings-card">
<h3>Email and web chat</h3>
<dl>
<div><dt>Email</dt><dd>{{0}}</dd></div>
<div><dt>Mailbox</dt><dd>{{1}}</dd></div>
<div><dt>Email worker</dt><dd>{{2}}</dd></div>
<div><dt>Last success</dt><dd>{{3}}</dd></div>
<div><dt>Web chat</dt><dd>{{4}}</dd></div>
<div><dt>Chat AI</dt><dd>{{5}}</dd></div>
</dl>
</section>
  </template>
  <template id="settings-responsive">
<details class="panel settings-card">
<summary>Responsive contract</summary>
<dl>
<div>
<dt>Minimum width</dt>
<dd>{{0}}px</dd>
</div>
<div>
<dt>Pagination</dt>
<dd>{{1}}</dd>
</div>
<div>
<dt>Actions</dt>
<dd>{{2}}</dd>
</div>
</dl>
</details>
  </template>
  <template id="manual-mail-toolbar">
<section class="manual-mail-toolbar" aria-label="Manual mailboxes">
      {{0}}
      <label class="manual-mail-folder">Folder <select data-mail-folder aria-label="Mail folder">{{1}}</select></label>
      <button class="button secondary" data-action="refresh-mail" data-slot-2="">Refresh</button>
    </section>
  </template>
  <template id="workspace-attachment">
<article class="attachment-row">
                <div class="attachment-icon">{{0}}</div>
                <div class="attachment-meta">
                  <strong>{{1}}</strong>
                  <small>{{2}}</small>
                </div>
                {{3}}
              </article>
  </template>
  <template id="workspace-contact">
        <section class="panel detail-card {{0}}" data-context-section="details">
          <header><strong>Contact</strong></header>
          <div class="contact-hero">
            <div class="avatar large">{{1}}</div>
            <div>
              <strong>{{2}}</strong>
              <span>{{3}}</span>
              <small>{{4}}</small>
            </div>
          </div>
          <dl>
            <div><dt>Handling</dt><dd>{{5}}</dd></div>
            <div>
              <dt>Response target</dt>
              <dd>{{6}}</dd>
            </div>
            <div><dt>Workflow</dt><dd>{{7}}</dd></div>
          </dl>
          {{8}}
        </section>
  </template>
  <template id="workspace-handling">
<div class="handling-control">
            <span>Who handles this?</span>
            <div class="handling-segment" role="group" aria-label="Conversation handling">
              <button type="button" data-handling-mode="automation" class="{{0}}"
                aria-pressed="{{1}}">Automated</button>
              <button type="button" data-handling-mode="person" class="{{2}}"
                aria-pressed="{{3}}">Assigned to me</button>
            </div>
            <small>{{4}}</small>
          </div>
  </template>
  <template id="connection-error">
    <section class="connection-error panel" role="alert">
      <div class="error-orb">!</div>
      <h2>{{0}}</h2>
      <p>Check the gateway URL, HIVE session verification and AIMS Comms Hub readiness.</p>
      <div><button class="button primary" data-action="refresh">Try again</button></div>
    </section>
  </template>
  <template id="newsletter-header">
      <header class="panel-header"><div><strong>Newsletter confirmation</strong><span>SMTP acceptance and confirmed consent are separate outcomes.</span></div></header>
  </template>
  <template id="newsletter-note">
      <p>Signup request counters are cumulative for the backend state file, outside this reporting window.</p>
  </template>
  <template id="reply-composer">
          <form id="reply-form" class="reply-composer">
            <textarea name="message" rows="3" maxlength="20000" placeholder="Write an operator reply…"
              aria-label="Operator reply" required data-slot-0=""></textarea>
            {{1}}
            <div>
              <span>{{2}}</span>
              <button class="button primary" type="submit"
                data-slot-0="">{{3}}</button>
            </div>
          </form>
  </template>
  <template id="mail-compose">
    <dialog class="manual-mail-dialog" id="manual-mail-dialog" aria-labelledby="manual-mail-dialog-title">
      <form method="dialog" class="manual-mail-compose" id="manual-mail-form">
        <header>
          <div><h2 id="manual-mail-dialog-title">New email</h2><p>Sending as {{0}}</p></div>
          <button type="button" class="icon-button" data-action="close-mail-dialog" aria-label="Close">{{1}}</button>
        </header>
        <label>To<input name="to" type="email" required autocomplete="off"></label>
        <label>Subject<input name="subject" maxlength="500" required></label>
        <label>Message<textarea name="bodyText" rows="10" required></textarea></label>
        <input name="inReplyTo" type="hidden"><input name="references" type="hidden">
        <p role="alert" data-mail-compose-error hidden></p>
        <footer><button type="button" class="button secondary" data-action="close-mail-dialog">Cancel</button><button type="submit" class="button primary">Send</button></footer>
      </form>
    </dialog>
  </template>
  <template id="contact-editor">
    <section class="panel contact-editor">
      <header class="panel-header stacked">
        <div>
          <strong>Manage contact</strong>
          <span>{{0}} linked conversation{{1}}</span>
        </div>
        <button class="icon-button" type="button" data-action="close-contact" aria-label="Close contact editor">
          {{2}}
        </button>
      </header>
      <form id="contact-edit-form" class="contact-edit-form">
        <label><span>Name</span><input name="displayName" maxlength="300" value="{{3}}" data-slot-6=""></label>
        <label><span>Email</span><input name="primaryEmail" type="email" maxlength="320" value="{{4}}" data-slot-6=""></label>
        <label><span>Phone</span><input name="phone" maxlength="100" value="{{5}}" data-slot-6=""></label>
        <div class="contact-edit-actions">
          <span>Deleting a contact keeps linked conversations intact and reassigns them to a non-personal placeholder.</span>
          <div class="button-row">
            {{7}}
            {{8}}
          </div>
        </div>
      </form>
    </section>
  </template>
  <template id="audio-settings">
<section class="panel settings-card comms-audio-settings">
<h3>Audio notifications</h3>
<p>Only actionable alerts sound.</p>
<label><input type="checkbox" data-comms-audio="enabled"> Sound on</label>
<label><input type="checkbox" data-comms-audio="review_required"> Review required sound</label>
<label><input type="checkbox" data-comms-audio="urgent"> Urgent sound</label>
<label><input type="checkbox" data-comms-audio="resolved"> Resolved confirmation sound</label>
<label><input type="checkbox" data-comms-audio="new_message"> Actionable new message sound</label>
<label class="comms-audio-volume">
          Volume <input type="range" min="0" max="1" step="0.05" value="0.65" data-comms-audio="volume">
<span>65%</span>
</label>
<div class="comms-audio-actions">
<button class="button secondary" type="button" data-action="test-comms-sound">Test Sound</button>
</div>
<p class="comms-audio-status" role="status" aria-live="polite"></p>
</section>
  </template>
  <template id="security-boundary">
<details class="panel settings-card">
<summary>Security boundary</summary>
<p>The browser holds no AIMS delegation secret. HIVE identity verification and HMAC signing happen in the
          edge gateway before AIMS performs its own RBAC checks.</p>
</details>
  </template>
  <template id="comms-indicator-key">
    <details class="comms-indicator-key"><summary>Indicator key</summary>
      <p>Cards: priority above status. Tables: separate columns.</p>
      <section><strong>Priority</strong><div class="comms-key-items">
        <span><span class="signal-lamp signal-red" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>Critical</span>
        <span><span class="signal-lamp signal-orange" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>High</span>
        <span><span class="signal-lamp signal-amber" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Medium</span>
        <span><span class="signal-lamp signal-info" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Normal</span>
        <span><span class="signal-lamp signal-low" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="true"></span></span>Low</span>
        <span><span class="signal-lamp signal-neutral" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Unknown</span>
      </div></section>
      <section><strong>Conversation</strong><div class="comms-key-items">
        <span><span class="signal-lamp signal-red" aria-hidden="true"><span data-lens="red" data-active="true"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="false"></span></span>Failed / blocked</span>
        <span><span class="signal-lamp signal-amber" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Pending</span>
        <span><span class="signal-lamp signal-info" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Open</span>
        <span><span class="signal-lamp signal-green" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="false"></span><span data-lens="green" data-active="true"></span></span>Resolved / sent</span>
        <span><span class="signal-lamp signal-purple" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Snoozed</span>
        <span><span class="signal-lamp signal-neutral" aria-hidden="true"><span data-lens="red" data-active="false"></span><span data-lens="amber" data-active="true"></span><span data-lens="green" data-active="false"></span></span>Unknown</span>
      </div></section>
    </details>
  </template>
  <dialog id="aims-commands" aria-label="Command palette" class="manual-mail-dialog">
    <form method="dialog" class="manual-mail-compose">
      <h2>Find a page</h2>
      <label>Page<input list="aims-command-pages" placeholder="Find a page…" autocomplete="off" required></label>
      <datalist id="aims-command-pages"></datalist>
      <footer><button type="submit" formnovalidate value="cancel" class="button secondary">Cancel</button>
        <button type="submit" class="button primary">Open</button></footer>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
