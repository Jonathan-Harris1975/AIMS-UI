name: AIMS-UI deployed integration

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] exact-SHA verifier accepts only successful same-repository main pushes
    workflows: ["Validate AIMS UI"]
    types: [completed]
permissions:
  contents: read

concurrency:
  group: aims-ui-deployed-integration-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  integration:
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate expected deployed commit SHA
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$EXPECTED_DEPLOYMENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::Expected deployment SHA must be a full 40-character Git commit SHA.' >&2
            exit 1
          fi
      - name: Require checked-out source to match the requested deployment SHA
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(printf '%s' "$EXPECTED_DEPLOYMENT_SHA" | tr '[:upper:]' '[:lower:]')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@10.9.9
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"
      - name: Verify exact deployed Worker and integration path
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          AIMS_UI_BASE_URL: ${{ vars.AIMS_UI_BASE_URL || 'https://chat.jonathan-harris.online' }}
          HIVE_UI_BASE_URL: ${{ vars.HIVE_UI_BASE_URL || 'https://hive.jonathan-harris.online' }}
          WEBSITE_ORIGIN: ${{ vars.WEBSITE_BASE_URL || 'https://jonathan-harris.online' }}
          HIVE_UI_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
          DEPLOYED_INTEGRATION_REQUIRE_HIVE: 'true'
        run: |
          set -o pipefail
          npm run test:deployed | tee deployed-integration.log
      - name: Record deployed-integration attestation
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          HIVE_UI_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
        run: |
          if [ -z "${HIVE_UI_ACCESS_KEY:-}" ]; then
            echo '::error::HIVE_UI_ACCESS_KEY is required; full UI-to-HIVE health cannot be attested.' >&2
            exit 1
          fi
          printf '{"repository":"%s","source_sha":"%s","deployed_sha":"%s","workflow_run":"%s","status":"deployed-integration-green-full","health_check":"passed","hive_handoff":"passed"}\n' \
            "$GITHUB_REPOSITORY" "$EXPECTED_DEPLOYMENT_SHA" "$EXPECTED_DEPLOYMENT_SHA" "$GITHUB_RUN_ID" > deployed-integration-attestation.json
      - name: Retain deployed-integration attestation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-integration-attestation-${{ github.event.workflow_run.head_sha }}
          path: |
            deployed-integration-attestation.json
            deployed-integration.log
          if-no-files-found: warn
          retention-days: 90

  integration_closure:
    name: Deployed integration closure (exact SHA)
    needs: [integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact-SHA health attestation
        if: needs.integration.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-integration-attestation-${{ github.event.workflow_run.head_sha }}
          path: deployed-integration-evidence
      - name: Require exact-SHA production health evidence or report intentional non-applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          ATTESTATION_PATH: deployed-integration-evidence/deployed-integration-attestation.json
        run: node scripts/workflow-run-gate.mjs
