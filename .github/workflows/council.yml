name: Repository Council

on:
  # Dispatch only: release Council only after merge/deployment evidence has settled.
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact default-branch SHA to judge (blank = current default branch)"
        required: false
        type: string
      pending_minimum_age:
        description: "Renovate updates still waiting on minimumReleaseAge (from the dashboard)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: repository-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check out trusted Council definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve and validate target SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          default_sha="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
          target="${REQUESTED_SHA:-$default_sha}"
          resolved="$(gh api "repos/${REPO}/commits/${target}" --jq '.sha')"
          if [ "$resolved" != "$default_sha" ]; then
            echo "::error::Council only judges the current default-branch SHA. Requested/resolved ${resolved}; current ${default_sha}."
            exit 1
          fi
          printf 'sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

      - name: Require current exact-SHA CI and security evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRED_WORKFLOWS: "Validate AIMS UI|CodeQL|Security and repository quality|Item 6 hardening"
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r -a required <<< "$REQUIRED_WORKFLOWS"
          for _ in $(seq 1 60); do
            runs="$(gh api --paginate --slurp "repos/${REPO}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" --jq 'map(.workflow_runs) | add')"
            ready=true
            for workflow in "${required[@]}"; do
              result="$(jq -r --arg name "$workflow" --arg branch "$DEFAULT_BRANCH" --arg sha "$TARGET_SHA" \
                '[.[] | select(.name == $name and .head_branch == $branch and .head_sha == $sha and .event != "pull_request")] | sort_by(.run_number, .run_attempt) | last | if .status == "completed" then .conclusion else "pending" end' <<< "$runs")"
              case "$result" in
                success) ;;
                failure|cancelled|timed_out|action_required|skipped|neutral|stale)
                  echo "::error::Required workflow $workflow returned $result for $TARGET_SHA."
                  exit 1 ;;
                *) ready=false ;;
              esac
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Exact-SHA CI/security evidence did not become ready."
          exit 1

      - name: Refuse Council while autonomous repair is unresolved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          blockers="$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json number,title,labels,url \
            --jq '[.[] | select(any(.labels[]?; .name == "autonomy:human-hold") or (any(.labels[]?; .name == "autonomy:repair") and (any(.labels[]?; .name == "autonomy:obsolete" or .name == "autonomy:superseded") | not)))]')"
          count="$(jq 'length' <<< "$blockers")"
          if [ "$count" -gt 0 ]; then
            echo "::error::Council cannot start with ${count} unresolved autonomy repair/human-hold PR(s)."
            jq -r '.[] | "#\(.number) \(.title) \(.url)"' <<< "$blockers"
            exit 1
          fi

      - name: Validate Kilo Council trigger
        env:
          KILO_REPAIR_TRIGGER_URL: ${{ secrets.KILO_REPAIR_TRIGGER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KILO_REPAIR_TRIGGER_URL:-}" || { echo "::error::KILO_REPAIR_TRIGGER_URL is required."; exit 1; }
          python3 .github/scripts/kilo_webhook_url.py

      - name: Dispatch repository Council to Kilo
        env:
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PENDING_MINIMUM_AGE: ${{ inputs.pending_minimum_age || 'unknown' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KILO_REPAIR_TRIGGER_URL: ${{ secrets.KILO_REPAIR_TRIGGER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          prompt="$(cat .council/council.md)"
          prompt="${prompt}"
          test -n "${prompt//[[:space:]]/}" || { echo "::error::Council contract is empty."; exit 1; }
          task="$(cat <<EOF
          Run the repository Council defined below against exact SHA ${TARGET_SHA} in ${REPO}.
          The checked-in .council/council.md is the authoritative Council contract.
          Inspect live GitHub Actions, security, pull-request, merge, deployment and repository evidence tied to that SHA.
          Do not infer missing evidence and do not weaken checks.
          Renovate updates still waiting on minimumReleaseAge at this run: ${PENDING_MINIMUM_AGE}. Record them as PENDING_MINIMUM_AGE (not a failure).
          If a safe repository change is required, make the smallest justified change on one branch and open one PR against the default branch. Do not merge or deploy it yourself.
          If no code change is required, do not create a cosmetic PR.
          Return the Council disposition and evidence in the Kilo task result.

          ${prompt}
          EOF
          )"
          payload="$(jq -n \
            --arg repository "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg run "$RUN_URL" \
            --arg task "$task" \
            '{repository:$repository,target_sha:$sha,council_run:$run,kind:"repository-council",task:$task}')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --request POST --header 'Content-Type: application/json' --data "$payload" "$KILO_REPAIR_TRIGGER_URL")"
          if [[ "$status" != 2?? ]]; then
            echo "::error::Kilo Council trigger returned HTTP ${status}."
            exit 1
          fi
          echo "Council dispatched for ${REPO}@${TARGET_SHA}."
          mkdir -p "$RUNNER_TEMP/council-r2"
          task_sha256="$(printf '%s' "$task" | sha256sum | awk '{print $1}')"
          jq -n \
            --arg repository "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg task_sha256 "$task_sha256" \
            '{repository:$repository,sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,council_run:$run_url,status:"DISPATCHED",final_result_persisted:false,task_sha256:$task_sha256}' \
            > "$RUNNER_TEMP/council-r2/dispatch-evidence.json"


      - name: Persist Council dispatch evidence to hive-repositories R2
        if: always() && steps.target.outputs.sha != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/council-r2/dispatch-evidence.json" || {
            echo "::error::Council was not successfully dispatched; no Council evidence will be fabricated."
            exit 1
          }
          bash .github/scripts/persist_r2_evidence.sh council-dispatch "$TARGET_SHA" "$RUNNER_TEMP/council-r2"
\\n\\n'"IMPORTANT COMPLETION RETURN CONTRACT: after producing the real completed Council assessment, return it to this repository by dispatching workflow council-result-r2.yml on the default branch. Supply target_sha=${TARGET_SHA}, source_council_run_id=${GITHUB_RUN_ID}, disposition=<real Council disposition>, report_md_b64=<base64 of the completed Markdown report>, and report_json_b64=<base64 of the completed JSON report>. The JSON must include repository and exact_evaluated_sha. Do not report Council persistence complete unless that return workflow succeeds and verifies R2 storage."

          test -n "${prompt//[[:space:]]/}" || { echo "::error::Council contract is empty."; exit 1; }
          task="$(cat <<EOF
          Run the repository Council defined below against exact SHA ${TARGET_SHA} in ${REPO}.
          The checked-in .council/council.md is the authoritative Council contract.
          Inspect live GitHub Actions, security, pull-request, merge, deployment and repository evidence tied to that SHA.
          Do not infer missing evidence and do not weaken checks.
          Renovate updates still waiting on minimumReleaseAge at this run: ${PENDING_MINIMUM_AGE}. Record them as PENDING_MINIMUM_AGE (not a failure).
          If a safe repository change is required, make the smallest justified change on one branch and open one PR against the default branch. Do not merge or deploy it yourself.
          If no code change is required, do not create a cosmetic PR.
          Return the Council disposition and evidence in the Kilo task result.

          ${prompt}
          EOF
          )"
          payload="$(jq -n \
            --arg repository "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg run "$RUN_URL" \
            --arg task "$task" \
            '{repository:$repository,target_sha:$sha,council_run:$run,kind:"repository-council",task:$task}')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --request POST --header 'Content-Type: application/json' --data "$payload" "$KILO_REPAIR_TRIGGER_URL")"
          if [[ "$status" != 2?? ]]; then
            echo "::error::Kilo Council trigger returned HTTP ${status}."
            exit 1
          fi
          echo "Council dispatched for ${REPO}@${TARGET_SHA}."
          mkdir -p "$RUNNER_TEMP/council-r2"
          task_sha256="$(printf '%s' "$task" | sha256sum | awk '{print $1}')"
          jq -n \
            --arg repository "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg task_sha256 "$task_sha256" \
            '{repository:$repository,sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,council_run:$run_url,status:"DISPATCHED",final_result_persisted:false,task_sha256:$task_sha256}' \
            > "$RUNNER_TEMP/council-r2/dispatch-evidence.json"


      - name: Persist Council dispatch evidence to hive-repositories R2
        if: always() && steps.target.outputs.sha != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/council-r2/dispatch-evidence.json" || {
            echo "::error::Council was not successfully dispatched; no Council evidence will be fabricated."
            exit 1
          }
          bash .github/scripts/persist_r2_evidence.sh council-dispatch "$TARGET_SHA" "$RUNNER_TEMP/council-r2"
