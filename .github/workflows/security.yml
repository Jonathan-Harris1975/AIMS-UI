name: Security and repository quality
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: aims-ui-security-${{ github.ref }}
  cancel-in-progress: true
env:
  TRIVY_VERSION: 0.74.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  LYCHEE_VERSION: 0.24.2
  SCORECARD_VERSION: 5.5.0
jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
      with:
        egress-policy: audit
    - name: Checkout repository with full history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    # This is part of the required security gate: autonomy controls must not
    # silently regress while scanners continue to report green.
    - name: Verify automation ownership and Council-freeze lifecycle
      run: python3 .github/scripts/test_autonomy_lifecycle.py
      id: autonomy_tests
    - name: Verify PR blocker recovery regressions
      id: blocker_recovery_tests
      continue-on-error: true
      run: python3 .github/scripts/test_pr_blocker_recovery.py
    - name: Prepare isolated diagnostic paths
      run: mkdir -p "$RUNNER_TEMP/security-raw" "$RUNNER_TEMP/security-diagnostics"
    - name: Test diagnostic redaction and failure handling
      id: security_tests
      run: python3 .github/scripts/test_security_diagnostics.py
      continue-on-error: true
    - name: Install pinned CI tools
      run: python scripts/install_ci_tools.py trivy gitleaks actionlint
      id: install_security_tools
    - name: Verify Gitleaks exact-fingerprint ignore contract
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        fixture="$(mktemp -d)"
        trap 'rm -rf "$fixture"' EXIT
        cd "$fixture"
        git init -q
        git config user.name 'AIMS-UI CI'
        git config user.email 'ci@example.invalid'

        canary_one="ghp_$(printf 'aims-ui-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
        printf 'token = "%s"\n' "$canary_one" > ignored.txt
        git add ignored.txt
        git commit -qm 'synthetic ignored finding'

        set +e
        "$GITHUB_WORKSPACE/.ci-tools/bin/gitleaks" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
        first_status=$?
        set -e
        test "$first_status" -eq 42 || {
          echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
          exit 1
        }

        fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
        printf '%s\n' "$fingerprint" > .gitleaksignore

        set +e
        "$GITHUB_WORKSPACE/.ci-tools/bin/gitleaks" git . --redact=100 --no-banner --exit-code 42
        ignored_status=$?
        set -e
        test "$ignored_status" -eq 0 || {
          echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
          exit 1
        }

        canary_two="ghp_$(printf 'aims-ui-gitleaks-ignore-contract-two' | sha256sum | cut -c1-36)"
        printf 'token = "%s"\n' "$canary_two" > unlisted.txt
        git add .gitleaksignore unlisted.txt
        git commit -qm 'synthetic unlisted finding'

        set +e
        "$GITHUB_WORKSPACE/.ci-tools/bin/gitleaks" git . --redact=100 --no-banner --exit-code 42
        unlisted_status=$?
        set -e
        test "$unlisted_status" -eq 42 || {
          echo "::error::Unlisted synthetic finding did not fail Gitleaks (exit $unlisted_status)."
          exit 1
        }

    - name: Trivy filesystem vulnerability and misconfiguration scan
      run: .ci-tools/bin/trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code
        1 --no-progress --format json --output "$RUNNER_TEMP/security-raw/trivy.json"
      id: trivy
      continue-on-error: true
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
    - name: Gitleaks full-history secret scan
      id: gitleaks
      continue-on-error: true
      run: |
        set -uo pipefail
        set +e
        .ci-tools/bin/gitleaks git . --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/security-raw/gitleaks.json" --exit-code 42
        status=$?
        if [ "$status" -eq 42 ]; then
          echo '::error::Potential secrets detected. See the Security findings and deployment blockers summary and security-diagnostics artifact.'
        elif [ "$status" -ne 0 ]; then
          echo "::error::Gitleaks execution failed (exit $status); this is an operational error, not a finding count. Inspect this step."
        fi
        exit "$status"
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
      shell: bash
    - name: Validate GitHub Actions workflows
      run: |
        set +e
        .ci-tools/bin/actionlint  -format '{{json .}}' > "$RUNNER_TEMP/security-raw/actionlint.json"
        status=$?
        if [ "$status" -eq 0 ]; then printf "[]\n" > "$RUNNER_TEMP/security-raw/actionlint.json"; fi
        exit "$status"
      id: actionlint
      continue-on-error: true
      if: ${{ !cancelled() && steps.install_security_tools.outcome == 'success' }}
    - name: Publish actionable security findings
      if: always()
      env:
        SECURITY_STEPS: ${{ toJSON(steps) }}
        RAW_REPORT_DIR: ${{ runner.temp }}/security-raw
        REPORT_DIR: ${{ runner.temp }}/security-diagnostics
      run: python3 .github/scripts/security_diagnostics.py
    - name: Upload metadata-only diagnostic reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/security-diagnostics/
        retention-days: 30
        if-no-files-found: error
    - name: Enforce all scanner results
      if: always()
      env:
        SECURITY_STEPS: ${{ toJSON(steps) }}
      run: |-
        python3 - <<'PYCODE'
        import json
        import os
        steps = json.loads(os.environ['SECURITY_STEPS'])
        failed = [name for name, step in steps.items() if step.get('outcome') in ('failure', 'cancelled')]
        if failed:
            print('::error::Security check blocked by: ' + ', '.join(failed) + '. Open the job summary and diagnostic artifact for details.')
            raise SystemExit(1)
        for name in ('gitleaks', 'trivy', 'actionlint'):
            if steps.get(name, {}).get('outcome') != 'success':
                print('::error::Required scanner did not complete successfully: ' + name)
                raise SystemExit(1)
        PYCODE
  link_integrity:
    name: Lychee link integrity
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pinned Lychee
      continue-on-error: true
      run: python scripts/install_ci_tools.py lychee
    - name: Check repository links
      continue-on-error: true
      run: .ci-tools/bin/lychee --no-progress --cache --max-retries 2 --timeout 20 README.md SECURITY.md docs config
  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
      with:
        egress-policy: audit
    - name: Install pinned Scorecard CLI from source
      continue-on-error: true
      env:
        GOBIN: ${{ runner.temp }}/scorecard-bin
      run: |
        set -euo pipefail
        mkdir -p "$GOBIN"
        go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
        "$GOBIN/scorecard" version
    - name: Run OpenSSF Scorecard
      continue-on-error: true
      env:
        GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
      run: |
        set -euo pipefail
        "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
        cat scorecard.json
