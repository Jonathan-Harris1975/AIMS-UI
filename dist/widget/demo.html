<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CogniPal widget demonstration</title>
  <style>
    :root { color-scheme:light; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17243a; background:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f8fafc,#edf2f8); }
    header { height:66px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(18px,5vw,78px); background:#fff; border-bottom:1px solid #dce3ec; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }.brand span { width:32px;height:32px;border-radius:9px;background:#213451;color:#fff;display:grid;place-items:center; }
    nav { display:flex; gap:24px; color:#66758b; font-size:13px; }
    main { max-width:1160px; margin:auto; padding:clamp(56px,8vw,110px) clamp(20px,5vw,76px); display:grid; grid-template-columns:1.1fr .9fr; gap:60px; align-items:center; }
    .eyebrow { color:#2e66d3; text-transform:uppercase; letter-spacing:.15em; font-size:11px; font-weight:800; }
    h1 { font-size:clamp(42px,6vw,78px); line-height:1.02; letter-spacing:-.055em; margin:16px 0 22px; max-width:760px; }
    p { color:#66758b; line-height:1.75; max-width:620px; font-size:17px; }
    .actions { display:flex; gap:10px; margin-top:30px; }.actions button { border:0;border-radius:11px;padding:12px 18px;font-weight:800; }.actions button:first-child { background:#2e66d3;color:#fff; }.actions button:last-child { background:#fff;color:#17243a;border:1px solid #dce3ec; }
    .visual { min-height:430px; border-radius:28px; border:1px solid #dce3ec; background:#fff; box-shadow:0 22px 60px rgba(31,49,80,.12); display:grid; place-items:center; padding:34px; overflow:hidden; position:relative; }
    .visual::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 20%,rgba(46,102,211,.14),transparent 36%),radial-gradient(circle at 80% 75%,rgba(32,167,114,.11),transparent 38%); }
    .visual img { width:min(300px,70%); aspect-ratio:1; object-fit:cover; object-position:center 28%; border-radius:34px; box-shadow:0 18px 42px rgba(28,45,76,.2); position:relative; }
    .hint { position:fixed; right:92px; bottom:36px; color:#53657b; font-size:12px; background:#fff; border:1px solid #dce3ec; border-radius:10px; padding:8px 11px; box-shadow:0 8px 22px rgba(31,49,80,.1); }
    @media(max-width:780px){ nav{display:none} main{grid-template-columns:1fr;padding-top:52px}.visual{min-height:300px}.hint{display:none} }
  </style>
</head>
<body>
  <header><div class="brand"><span>JH</span>Jonathan Harris</div><nav><span>Books</span><span>Podcast</span><span>Articles</span><span>About</span></nav></header>
  <main>
    <section><div class="eyebrow">Human-centred artificial intelligence</div><h1>AI without the fog machine.</h1><p>Practical thinking, books and conversations about artificial intelligence, automation and the systems reshaping modern work.</p><div class="actions"><button>Explore the latest</button><button>Listen to Turing’s Torch</button></div></section>
    <section class="visual"><img src="./assets/CogniPal.jpg" alt="CogniPal"></section>
  </main>
  <div class="hint">Open CogniPal here →</div>
  <script type="module" src="./cognipal-widget.js" data-site-id="jonathan-harris.online" data-icon-url="./assets/CogniPal.jpg" data-demo="1"></script>
</body>
</html>
